<div>
  <h2>Login</h2>
  <form (ngSubmit)="onLogin()">
    <div>
      <label for="login-username">Username</label>
      <input id="login-username" type="text" [(ngModel)]="username" name="username" required>
    </div>
    <div>
      <label for="login-password">Password</label>
      <input id="login-password" type="password" [(ngModel)]="password" name="password" required>
    </div>
    <button id="login-submit-btn" type="submit">Login</button>
  </form>
</div>
