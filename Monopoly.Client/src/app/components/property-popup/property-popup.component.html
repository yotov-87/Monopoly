<div class="popup-overlay" *ngIf="cell" (click)="onClose()">
  <div class="popup-content" (click)="$event.stopPropagation()">
    <div class="popup-header">
      <h2>{{ cell.name }}</h2>
      <button class="close-btn" (click)="onClose()">×</button>
    </div>
    
    <div class="popup-body">
      <div class="property-info">
        <div class="color-indicator" *ngIf="cell.colorGroup" [ngClass]="cell.colorGroup"></div>
        
        <div class="info-row">
          <span class="label">Price:</span>
          <span class="value">${{ cell.price }}</span>
        </div>
        
        <div class="info-row">
          <span class="label">Your Money:</span>
          <span class="value">${{ playerMoney }}</span>
        </div>
        
        <div class="info-row" *ngIf="!canAfford()">
          <span class="error-message">⚠️ Not enough money!</span>
        </div>
      </div>
    </div>
    
    <div class="popup-footer">
      <button class="btn btn-secondary" (click)="onClose()">Cancel</button>
      <button 
        class="btn btn-primary" 
        [disabled]="!canAfford()"
        (click)="onPurchase()">
        Purchase for ${{ cell.price }}
      </button>
    </div>
  </div>
</div>
