<div class="create-game-container">
  <div class="create-game-card">
    <h2>Create New Game</h2>
    <form (ngSubmit)="onCreateGame()">
      <div class="form-group">
        <label for="create-game-name">Game Name</label>
        <input 
          id="create-game-name" 
          type="text" 
          [(ngModel)]="gameName" 
          name="gameName" 
          placeholder="Enter game name"
          required>
      </div>
      
      <div class="form-group">
        <label for="create-game-player-count">Number of Players</label>
        <div class="player-count-selector">
          <button 
            type="button" 
            class="count-btn" 
            (click)="playerCount = playerCount - 1"
            [disabled]="playerCount <= minPlayers">
            -
          </button>
          <input 
            id="create-game-player-count" 
            type="number" 
            [(ngModel)]="playerCount" 
            name="playerCount"
            [min]="minPlayers"
            [max]="maxPlayers"
            required>
          <button 
            type="button" 
            class="count-btn" 
            (click)="playerCount = playerCount + 1"
            [disabled]="playerCount >= maxPlayers">
            +
          </button>
        </div>
        <small class="help-text">Select between {{ minPlayers }} and {{ maxPlayers }} players</small>
      </div>
      
      <div class="button-group">
        <button id="create-game-cancel-btn" type="button" class="cancel-btn" (click)="onCancel()">Cancel</button>
        <button id="create-game-submit-btn" type="submit" class="submit-btn">Create Game</button>
      </div>
    </form>
  </div>
</div>
