<div class="create-game-container">
  <!-- Step 1: Game Settings -->
  <div *ngIf="currentStep === 1" class="create-game-card">
    <h2>Create New Game</h2>
    <form (ngSubmit)="onNextStep()">
      <div class="form-group">
        <label for="create-game-name">Game Name</label>
        <input 
          id="create-game-name" 
          type="text" 
          [(ngModel)]="gameName" 
          name="gameName" 
          placeholder="Enter game name"
          required>
      </div>
      
      <div class="form-group">
        <label for="create-game-player-count">Number of Players</label>
        <div class="player-count-selector">
          <button 
            type="button" 
            class="count-btn" 
            (click)="playerCount = playerCount - 1"
            [disabled]="playerCount <= minPlayers">
            -
          </button>
          <input 
            id="create-game-player-count" 
            type="number" 
            [(ngModel)]="playerCount" 
            name="playerCount"
            [min]="minPlayers"
            [max]="maxPlayers"
            required>
          <button 
            type="button" 
            class="count-btn" 
            (click)="playerCount = playerCount + 1"
            [disabled]="playerCount >= maxPlayers">
            +
          </button>
        </div>
        <small class="help-text">Select between {{ minPlayers }} and {{ maxPlayers }} players</small>
      </div>
      
      <div class="button-group">
        <button id="create-game-cancel-btn" type="button" class="cancel-btn" (click)="onCancel()">Cancel</button>
        <button id="create-game-next-btn" type="submit" class="submit-btn">Next: Configure Properties</button>
      </div>
    </form>
  </div>

  <!-- Step 2: Configure Property Settings -->
  <div *ngIf="currentStep === 2" class="create-game-card board-config-card">
    <h2>Configure Property Settings</h2>
    <p class="instructions">Set custom values for each property (default: $10 for all)</p>
    
    <div class="properties-grid">
      <div *ngFor="let colorGroup of getColorGroups()" class="color-group">
        <h3 class="color-group-title" [style.color]="getColorGroupColor(colorGroup)">
          {{ colorGroup }}
        </h3>
        <div *ngFor="let prop of groupPropertiesByColor()[colorGroup]" class="property-item">
          <div class="property-info">
            <span class="color-badge" [style.background-color]="getColorGroupColor(colorGroup)"></span>
            <span class="property-name">{{ prop.name }}</span>
          </div>
          <div class="property-inputs">
            <div class="input-field">
              <label>Price</label>
              <div class="input-with-currency">
                <span class="currency">$</span>
                <input 
                  type="number" 
                  [(ngModel)]="prop.price" 
                  [min]="10"
                  [max]="10000"
                  class="value-input">
              </div>
            </div>
            <div class="input-field">
              <label>Rent</label>
              <div class="input-with-currency">
                <span class="currency">$</span>
                <input 
                  type="number" 
                  [(ngModel)]="prop.rent" 
                  [min]="10"
                  [max]="10000"
                  class="value-input">
              </div>
            </div>
            <!-- Only show House and Hotel fields for regular properties, not for Railroad or Utility -->
            <div *ngIf="prop.colorGroup !== 'Railroad' && prop.colorGroup !== 'Utility'" class="input-field">
              <label>House</label>
              <div class="input-with-currency">
                <span class="currency">$</span>
                <input 
                  type="number" 
                  [(ngModel)]="prop.housePrice" 
                  [min]="10"
                  [max]="10000"
                  class="value-input">
              </div>
            </div>
            <div *ngIf="prop.colorGroup !== 'Railroad' && prop.colorGroup !== 'Utility'" class="input-field">
              <label>Hotel</label>
              <div class="input-with-currency">
                <span class="currency">$</span>
                <input 
                  type="number" 
                  [(ngModel)]="prop.hotelPrice" 
                  [min]="10"
                  [max]="10000"
                  class="value-input">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="button-group">
      <button type="button" class="cancel-btn" (click)="onBackStep()">Back</button>
      <button type="button" class="submit-btn" (click)="onCreateGame()">Create Game</button>
    </div>
  </div>
</div>
