<div class="create-game-container">
  <!-- Step 1: Game Settings -->
  <div *ngIf="currentStep === 1" class="create-game-card">
    <h2>Create New Game</h2>
    <form (ngSubmit)="onNextStep()">
      <div class="form-group">
        <label for="create-game-name">Game Name</label>
        <input 
          id="create-game-name" 
          type="text" 
          [(ngModel)]="gameName" 
          name="gameName" 
          placeholder="Enter game name"
          required>
      </div>
      
      <div class="form-group">
        <label for="create-game-player-count">Number of Players</label>
        <div class="player-count-selector">
          <button 
            type="button" 
            class="count-btn" 
            (click)="playerCount = playerCount - 1"
            [disabled]="playerCount <= minPlayers">
            -
          </button>
          <input 
            id="create-game-player-count" 
            type="number" 
            [(ngModel)]="playerCount" 
            name="playerCount"
            [min]="minPlayers"
            [max]="maxPlayers"
            required>
          <button 
            type="button" 
            class="count-btn" 
            (click)="playerCount = playerCount + 1"
            [disabled]="playerCount >= maxPlayers">
            +
          </button>
        </div>
        <small class="help-text">Select between {{ minPlayers }} and {{ maxPlayers }} players</small>
      </div>
      
      <div class="button-group">
        <button id="create-game-cancel-btn" type="button" class="cancel-btn" (click)="onCancel()">Cancel</button>
        <button id="create-game-next-btn" type="submit" class="submit-btn">Next: Configure Properties</button>
      </div>
    </form>
  </div>

  <!-- Step 2: Configure Property Settings -->
  <div *ngIf="currentStep === 2" class="create-game-card board-config-card">
    <h2>Configure Property Settings</h2>
    <p class="instructions">Set custom values for each property (default: $10 for all)</p>
    
    <!-- Template Management Section -->
    <div class="template-section">
      <div class="template-controls">
        <div class="template-selector">
          <label for="template-select">Load Template:</label>
          <select 
            id="template-select" 
            [(ngModel)]="selectedTemplateId" 
            class="template-dropdown">
            <option [ngValue]="null">-- No template --</option>
            <option *ngFor="let template of templates" [ngValue]="template.id">
              {{ template.name }}
              <span *ngIf="template.description"> - {{ template.description }}</span>
            </option>
          </select>
          <button 
            type="button" 
            class="load-btn" 
            (click)="onLoadTemplate()"
            [disabled]="!selectedTemplateId">
            Load
          </button>
        </div>
        <button 
          type="button" 
          class="save-template-btn" 
          (click)="onShowSaveDialog()">
          Save as Template
        </button>
      </div>
    </div>
    
    <div class="properties-grid">
      <div *ngFor="let colorGroup of getColorGroups()" class="color-group">
        <h3 class="color-group-title" [style.color]="getColorGroupColor(colorGroup)">
          {{ colorGroup }}
        </h3>
        <div *ngFor="let prop of groupPropertiesByColor()[colorGroup]" class="property-item">
          <div class="property-info">
            <span class="color-badge" [style.background-color]="getColorGroupColor(colorGroup)"></span>
            <span class="property-name">{{ prop.name }}</span>
          </div>
          <div class="property-inputs">
            <div class="input-field">
              <label>Price</label>
              <div class="input-with-currency">
                <span class="currency">$</span>
                <input 
                  type="number" 
                  [(ngModel)]="prop.price" 
                  [min]="10"
                  [max]="10000"
                  class="value-input">
              </div>
            </div>
            <div class="input-field">
              <label>Rent</label>
              <div class="input-with-currency">
                <span class="currency">$</span>
                <input 
                  type="number" 
                  [(ngModel)]="prop.rent" 
                  [min]="10"
                  [max]="10000"
                  class="value-input">
              </div>
            </div>
            <!-- Only show House and Hotel fields for regular properties, not for Railroad or Utility -->
            <div *ngIf="prop.colorGroup !== 'Railroad' && prop.colorGroup !== 'Utility'" class="input-field">
              <label>House</label>
              <div class="input-with-currency">
                <span class="currency">$</span>
                <input 
                  type="number" 
                  [(ngModel)]="prop.housePrice" 
                  [min]="10"
                  [max]="10000"
                  class="value-input">
              </div>
            </div>
            <div *ngIf="prop.colorGroup !== 'Railroad' && prop.colorGroup !== 'Utility'" class="input-field">
              <label>Hotel</label>
              <div class="input-with-currency">
                <span class="currency">$</span>
                <input 
                  type="number" 
                  [(ngModel)]="prop.hotelPrice" 
                  [min]="10"
                  [max]="10000"
                  class="value-input">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="button-group">
      <button type="button" class="cancel-btn" (click)="onBackStep()">Back</button>
      <button type="button" class="submit-btn" (click)="onCreateGame()">Create Game</button>
    </div>
  </div>

  <!-- Save Template Dialog -->
  <div *ngIf="showSaveDialog" class="modal-overlay" (click)="onCancelSaveDialog()">
    <div class="modal-dialog" (click)="$event.stopPropagation()">
      <h3>Save Template</h3>
      <form (ngSubmit)="onSaveTemplate()">
        <div class="form-group">
          <label for="template-name">Template Name *</label>
          <input 
            id="template-name"
            type="text" 
            [(ngModel)]="templateName" 
            name="templateName"
            placeholder="Enter template name"
            required
            maxlength="100">
        </div>
        
        <div class="form-group">
          <label for="template-description">Description</label>
          <textarea 
            id="template-description"
            [(ngModel)]="templateDescription" 
            name="templateDescription"
            placeholder="Optional description"
            rows="3"
            maxlength="500"></textarea>
        </div>
        
        <div class="button-group">
          <button type="button" class="cancel-btn" (click)="onCancelSaveDialog()">Cancel</button>
          <button type="submit" class="submit-btn">Save Template</button>
        </div>
      </form>
    </div>
  </div>
</div>
