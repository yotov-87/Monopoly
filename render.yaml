databases:
  # PostgreSQL Database (Free tier - 90 days)
  - name: monopoly-db
    databaseName: monopoly
    user: monopoly
    plan: free

services:
  # Backend API (.NET 8)
  - type: web
    name: monopoly-api
    runtime: docker
    dockerfilePath: ./Monopoly.Api/Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: PORT
        value: 10000
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: monopoly-db
          property: connectionString
      - key: JwtSettings__SecretKey
        generateValue: true
      - key: JwtSettings__Issuer
        value: MonopolyApi
      - key: JwtSettings__Audience
        value: MonopolyClient
      - key: FRONTEND_URL
        value: monopoly-frontend.onrender.com
    healthCheckPath: /health

  # Frontend (Angular Static Site)
  - type: web
    name: monopoly-frontend
    runtime: static
    buildCommand: chmod +x Monopoly.Client/build.sh && ./Monopoly.Client/build.sh
    staticPublishPath: ./Monopoly.Client/dist/monopoly.client/browser
    envVars:
      - key: RENDER_API_URL
        value: https://monopoly-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
